[project]
name = "simuloom"
version = "0.1.0"
description = "SimuLoom - Fairness-Aware Queue Experimentation Lab (backend)"
requires-python = ">=3.12"
dependencies = [
    "simpy==4.1.2",
    "numpy>=2.2,<3",
    "scipy>=1.15,<2",
    "pydantic>=2.13,<2.14",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simuloom"]

[tool.pytest.ini_options]
testpaths = ["tests", "spikes"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 130
src = ["src", "tests", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/simuloom"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["simuloom", "tests", "spikes"]
